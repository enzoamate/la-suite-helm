name: Publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3

      - name: Installer les validateurs épinglés
        shell: bash
        run: |
          set -Eeuo pipefail
          install_dir="${RUNNER_TEMP}/validation-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          GOBIN="$install_dir" go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$install_dir" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep skopeo

      - name: Valider le tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag SemVer invalide : ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          for chart in charts/france-transfert charts/meet charts/messages; do
            chart_version="$(helm show chart "$chart" | awk '$1 == "version:" { print $2 }')"
            if [[ "$chart_version" != "$version" ]]; then
              echo "${chart}: version ${chart_version}, tag ${version}" >&2
              exit 1
            fi
          done

      - name: Contrôler les contenus documentaires
        run: ./scripts/check-placeholders.sh

      - name: Valider tous les charts et profils
        env:
          REQUIRE_KUBECONFORM: "true"
          KUBERNETES_VERSION: "1.29.0"
        run: ./scripts/validate.sh

      - name: Vérifier les images OCI critiques
        run: ./scripts/check-images.sh

      - name: Rechercher les secrets
        run: gitleaks detect --source . --no-git --redact --verbose

      - name: Construire les paquets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          for chart in charts/france-transfert charts/meet charts/messages; do
            helm package "$chart" --destination dist
          done
          (
            cd dist
            sha256sum ./*.tgz > SHA256SUMS
          )

      - name: Se connecter à GHCR
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publier les charts OCI
        shell: bash
        run: |
          set -Eeuo pipefail
          for package in dist/*.tgz; do
            helm push "$package" oci://ghcr.io/enzoamate/charts
          done

      - name: Créer la GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
