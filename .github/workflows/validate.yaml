name: Validation

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Installer Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3

      - name: Installer les validateurs épinglés
        shell: bash
        run: |
          set -Eeuo pipefail
          install_dir="${RUNNER_TEMP}/validation-bin"
          mkdir -p "$install_dir"
          GOBIN="$install_dir" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          GOBIN="$install_dir" go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$install_dir" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep skopeo

      - name: Contrôler les contenus documentaires
        run: ./scripts/check-placeholders.sh

      - name: Valider tous les charts et profils
        env:
          REQUIRE_KUBECONFORM: "true"
          KUBERNETES_VERSION: "1.29.0"
        run: ./scripts/validate.sh

      - name: Rechercher les secrets
        run: gitleaks detect --source . --no-git --redact --verbose

      - name: Vérifier les images OCI critiques
        run: ./scripts/check-images.sh
