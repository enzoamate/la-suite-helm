upstream:
  fullnameOverride: fichiers
  image:
    repository: lasuite/drive-backend
    tag: "v0.25.0"
    pullPolicy: IfNotPresent
  backend:
    replicas: 1
    createsuperuser:
      command: ["/bin/sh", "-c", "echo 'Création administrateur désactivée'"]
    configureWopi:
      command: ["/bin/sh", "-c", "echo 'Configuration WOPI désactivée'"]
  frontend:
    replicas: 1
    image:
      repository: lasuite/drive-frontend
      tag: "v0.25.0"
      pullPolicy: IfNotPresent
  ingress:
    enabled: false
  ingressAdmin:
    enabled: false
  ingressMedia:
    enabled: false
  ingressMediaPreview:
    enabled: false
  posthog:
    ingress:
      enabled: false
    ingressAssets:
      enabled: false
