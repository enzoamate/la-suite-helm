apiVersion: v1
kind: Service
metadata:
  name: {{ include "france-transfert.fullname" . }}-front
  labels:
    {{- include "france-transfert.labels" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  type: {{ .Values.front.service.type }}
  selector:
    {{- include "france-transfert.selectorLabels" (dict "root" . "component" "front") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.front.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "france-transfert.fullname" . }}-front
  labels:
    {{- include "france-transfert.labels" . | nindent 4 }}
    app.kubernetes.io/component: front
spec:
  replicas: {{ .Values.front.replicas }}
  selector:
    matchLabels:
      {{- include "france-transfert.selectorLabels" (dict "root" . "component" "front") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "france-transfert.selectorLabels" (dict "root" . "component" "front") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "france-transfert.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.front.podSecurityContext | nindent 8 }}
      containers:
        - name: front
          image: {{ include "france-transfert.image" .Values.images.front | quote }}
          imagePullPolicy: {{ .Values.images.front.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.front.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.front.probes.startup.path }}
              port: http
            {{- omit .Values.front.probes.startup "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.front.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.front.probes.readiness.path }}
              port: http
            {{- omit .Values.front.probes.readiness "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.front.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.front.probes.liveness.path }}
              port: http
            {{- omit .Values.front.probes.liveness "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.front.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.front.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tmp
              mountPath: /opt/bitnami/nginx/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.front.tmp.sizeLimit }}
---
