apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "france-transfert.fullname" . }}-worker
  labels:
    {{- include "france-transfert.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "france-transfert.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "france-transfert.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "france-transfert.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: 180
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "france-transfert.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "france-transfert.fullname" . }}-common
            - configMapRef:
                name: {{ include "france-transfert.fullname" . }}-worker
            - secretRef:
                name: {{ include "france-transfert.secretName" . }}
          ports:
            - name: management
              containerPort: {{ .Values.worker.managementPort }}
          {{- if .Values.worker.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.worker.probes.startup.path }}
              port: management
            {{- omit .Values.worker.probes.startup "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readiness.path }}
              port: management
            {{- omit .Values.worker.probes.readiness "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.liveness.path }}
              port: management
            {{- omit .Values.worker.probes.liveness "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /tmp
            - name: work
              mountPath: /opt/work
            - name: work
              mountPath: /data
      volumes:
        - name: work
          {{- if .Values.worker.work.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "france-transfert.fullname" . }}-worker
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.worker.work.sizeLimit }}
          {{- end }}
{{- if .Values.worker.work.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "france-transfert.fullname" . }}-worker
  labels:
    {{- include "france-transfert.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  accessModes:
    {{- toYaml .Values.worker.work.persistence.accessModes | nindent 4 }}
  {{- include "france-transfert.storageClass" .Values.worker.work.persistence.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.worker.work.persistence.size }}
{{- end }}
