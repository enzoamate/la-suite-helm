          securityContext:
            {{- toYaml .Values.upload.securityContext | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /tmp
            - name: work
              mountPath: /opt/work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.upload.work.sizeLimit }}
