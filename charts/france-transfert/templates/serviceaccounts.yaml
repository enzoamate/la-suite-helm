{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "france-transfert.serviceAccountName" . }}
  labels:
    {{- include "france-transfert.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.initialize.enabled .Values.initialize.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "france-transfert.initializeServiceAccountName" . }}
  labels:
    {{- include "france-transfert.labels" . | nindent 4 }}
    app.kubernetes.io/component: initialize
  {{- with .Values.initialize.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
