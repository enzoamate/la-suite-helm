{{- if eq .Values.livekit.mode "embedded" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meet.fullname" . }}-livekit
  labels:
    {{- include "meet.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit
  {{- with .Values.livekit.embedded.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.livekit.embedded.service.type }}
  {{- if ne .Values.livekit.embedded.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.livekit.embedded.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.livekit.embedded.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "meet.selectorLabels" (dict "root" . "component" "livekit") | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.livekit.embedded.service.httpPort }}
      targetPort: http
    - name: rtc-tcp
      protocol: TCP
      port: {{ .Values.livekit.embedded.service.tcpPort }}
      targetPort: rtc-tcp
    - name: rtc-udp
      protocol: UDP
      port: {{ .Values.livekit.embedded.service.udpPort }}
      targetPort: rtc-udp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meet.fullname" . }}-livekit
  labels:
    {{- include "meet.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "meet.selectorLabels" (dict "root" . "component" "livekit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meet.selectorLabels" (dict "root" . "component" "livekit") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "meet.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.livekit.embedded.podSecurityContext | nindent 8 }}
      containers:
        - name: livekit
          image: {{ include "meet.image" .Values.livekit.embedded.image | quote }}
          imagePullPolicy: {{ .Values.livekit.embedded.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              cat > /tmp/livekit.yaml <<EOF
              port: {{ .Values.livekit.embedded.service.httpPort }}
              rtc:
                tcp_port: {{ .Values.livekit.embedded.service.tcpPort }}
                udp_port: {{ .Values.livekit.embedded.service.udpPort }}
                use_external_ip: {{ .Values.livekit.embedded.rtc.useExternalIP }}
                enable_loopback_candidate: {{ .Values.livekit.embedded.rtc.enableLoopbackCandidate }}
              {{- with .Values.livekit.embedded.rtc.nodeIP }}
                node_ip: {{ . | quote }}
              {{- end }}
              keys:
                "$LIVEKIT_API_KEY": "$LIVEKIT_API_SECRET"
              EOF
              exec /livekit-server --config /tmp/livekit.yaml
          env:
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "meet.secretName" . }}
                  key: {{ .Values.secretKeys.livekitApiKey }}
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meet.secretName" . }}
                  key: {{ .Values.secretKeys.livekitApiSecret }}
          ports:
            - name: http
              protocol: TCP
              containerPort: {{ .Values.livekit.embedded.service.httpPort }}
            - name: rtc-tcp
              protocol: TCP
              containerPort: {{ .Values.livekit.embedded.service.tcpPort }}
            - name: rtc-udp
              protocol: UDP
              containerPort: {{ .Values.livekit.embedded.service.udpPort }}
          readinessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.livekit.embedded.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.livekit.embedded.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.livekit.embedded.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.livekit.embedded.securityContext | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
      {{- with .Values.livekit.embedded.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.livekit.embedded.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.livekit.embedded.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
