{{- if eq .Values.routing.type "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "meet.fullname" . }}
  labels:
    {{- include "meet.labels" . | nindent 4 }}
  {{- with .Values.routing.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.routing.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.routing.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.domain | quote }}
      {{- with .Values.routing.ingress.tls.secretName }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "meet.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /external-api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "meet.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: {{ include "meet.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "meet.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- if eq .Values.livekit.mode "embedded" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "meet.fullname" . }}-livekit
  labels:
    {{- include "meet.labels" . | nindent 4 }}
  {{- with .Values.routing.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.routing.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.routing.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.livekit.host | quote }}
      {{- with .Values.routing.ingress.tls.livekitSecretName }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.livekit.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "meet.fullname" . }}-livekit
                port:
                  number: {{ .Values.livekit.embedded.service.httpPort }}
{{- end }}
{{- end }}
{{- if eq .Values.routing.type "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "meet.fullname" . }}
  labels:
    {{- include "meet.labels" . | nindent 4 }}
  {{- with .Values.routing.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.routing.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /external-api/
        - path:
            type: PathPrefix
            value: /admin/
      backendRefs:
        - name: {{ include "meet.fullname" . }}-backend
          port: {{ .Values.backend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "meet.fullname" . }}-frontend
          port: {{ .Values.frontend.service.port }}
{{- if eq .Values.livekit.mode "embedded" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "meet.fullname" . }}-livekit
  labels:
    {{- include "meet.labels" . | nindent 4 }}
  {{- with .Values.routing.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.routing.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.livekit.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "meet.fullname" . }}-livekit
          port: {{ .Values.livekit.embedded.service.httpPort }}
{{- end }}
{{- end }}
