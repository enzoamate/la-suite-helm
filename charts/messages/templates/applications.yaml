apiVersion: v1
kind: Service
metadata:
  name: {{ include "messages.fullname" . }}-backend
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "messages.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messages.fullname" . }}-backend
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "messages.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messages.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- if and .Values.migration.enabled .Release.IsInstall }}
      initContainers:
        - name: wait-for-migrations
          image: {{ include "messages.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              attempt=1
              until python manage.py migrate --check >/dev/null 2>&1; do
                if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                  echo "Migrations incomplètes après ${attempt} tentatives" >&2
                  exit 1
                fi
                attempt=$((attempt + 1))
                sleep "$RETRY_DELAY"
              done
          envFrom:
            - configMapRef:
                name: {{ include "messages.fullname" . }}-backend
            - secretRef:
                name: {{ include "messages.secretName" . }}
          env:
            {{- include "messages.storageSecretEnv" . | nindent 12 }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.migration.retry.maxAttempts | quote }}
            - name: RETRY_DELAY
              value: {{ .Values.migration.retry.delaySeconds | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.migration.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "messages.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "messages.fullname" . }}-backend
            - secretRef:
                name: {{ include "messages.secretName" . }}
          env:
            {{- include "messages.storageSecretEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          {{- if .Values.backend.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.host | quote }}
                - name: X-Forwarded-Proto
                  value: https
            {{- omit .Values.backend.probes.readiness "enabled" "path" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- omit .Values.backend.probes.liveness "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messages.fullname" . }}-worker
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "messages.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messages.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      {{- if and .Values.migration.enabled .Release.IsInstall }}
      initContainers:
        - name: wait-for-migrations
          image: {{ include "messages.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              attempt=1
              until python manage.py migrate --check >/dev/null 2>&1; do
                if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
                  echo "Migrations incomplètes après ${attempt} tentatives" >&2
                  exit 1
                fi
                attempt=$((attempt + 1))
                sleep "$RETRY_DELAY"
              done
          envFrom:
            - configMapRef:
                name: {{ include "messages.fullname" . }}-backend
            - secretRef:
                name: {{ include "messages.secretName" . }}
          env:
            {{- include "messages.storageSecretEnv" . | nindent 12 }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.migration.retry.maxAttempts | quote }}
            - name: RETRY_DELAY
              value: {{ .Values.migration.retry.delaySeconds | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.migration.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "messages.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: [python, worker.py, {{ printf "--concurrency=%v" .Values.worker.concurrency | quote }}]
          envFrom:
            - configMapRef:
                name: {{ include "messages.fullname" . }}-backend
            - secretRef:
                name: {{ include "messages.secretName" . }}
          env:
            {{- include "messages.storageSecretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "messages.fullname" . }}-frontend
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "messages.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messages.fullname" . }}-frontend
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "messages.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messages.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "messages.image" .Values.images.frontend | quote }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          env:
            - name: MESSAGES_FRONTEND_BACKEND_SERVER
              value: {{ printf "%s-backend:%v" (include "messages.fullname" .) .Values.backend.service.port | quote }}
            {{- with .Values.frontend.trustedProxies }}
            - name: MESSAGES_FRONTEND_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.frontend.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.frontend.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /tmp
            - name: runtime
              mountPath: /data
            - name: runtime
              mountPath: /config
      volumes:
        - name: runtime
          emptyDir: {}
