{{- if eq .Values.postgresql.mode "cnpg" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "messages.fullname" . }}-db
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  instances: {{ .Values.postgresql.cnpg.instances }}
  imageName: {{ .Values.postgresql.cnpg.image | quote }}
  storage:
    {{- include "messages.storageClass" .Values.postgresql.cnpg.storageClass | nindent 4 }}
    size: {{ .Values.postgresql.cnpg.size }}
  bootstrap:
    initdb:
      database: {{ .Values.postgresql.database | quote }}
      owner: {{ .Values.postgresql.user | quote }}
      secret:
        name: {{ required "postgresql.cnpg.bootstrapSecretName est requis en mode CNPG" .Values.postgresql.cnpg.bootstrapSecretName | quote }}
  {{- with .Values.postgresql.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq .Values.redis.mode "embedded" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "messages.fullname" . }}-redis
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "messages.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "messages.fullname" . }}-redis
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "messages.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "messages.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messages.selectorLabels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.redis.embedded.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "messages.image" .Values.redis.embedded.image | quote }}
          imagePullPolicy: {{ .Values.redis.embedded.image.pullPolicy }}
          args: [--appendonly, "yes", --maxmemory-policy, noeviction]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            {{- toYaml .Values.redis.embedded.probes.readiness | nindent 12 }}
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            {{- toYaml .Values.redis.embedded.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.redis.embedded.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.redis.embedded.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.redis.embedded.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.redis.embedded.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.redis.embedded.persistence.accessModes | nindent 10 }}
        {{- include "messages.storageClass" .Values.redis.embedded.persistence.storageClass | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.redis.embedded.persistence.size }}
  {{- end }}
{{- end }}
{{- if eq .Values.opensearch.mode "embedded" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "messages.fullname" . }}-opensearch
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  selector:
    {{- include "messages.selectorLabels" (dict "root" . "component" "opensearch") | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "messages.fullname" . }}-opensearch
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  serviceName: {{ include "messages.fullname" . }}-opensearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "messages.selectorLabels" (dict "root" . "component" "opensearch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messages.selectorLabels" (dict "root" . "component" "opensearch") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.opensearch.embedded.podSecurityContext | nindent 8 }}
      containers:
        - name: opensearch
          image: {{ include "messages.image" .Values.opensearch.embedded.image | quote }}
          imagePullPolicy: {{ .Values.opensearch.embedded.image.pullPolicy }}
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.embedded.javaOpts | quote }}
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            {{- toYaml .Values.opensearch.embedded.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.opensearch.embedded.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.opensearch.embedded.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.opensearch.embedded.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      {{- if not .Values.opensearch.embedded.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.opensearch.embedded.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.opensearch.embedded.persistence.accessModes | nindent 10 }}
        {{- include "messages.storageClass" .Values.opensearch.embedded.persistence.storageClass | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.opensearch.embedded.persistence.size }}
  {{- end }}
{{- end }}
{{- if eq .Values.s3.mode "embedded" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "messages.fullname" . }}-s3
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
spec:
  selector:
    {{- include "messages.selectorLabels" (dict "root" . "component" "s3") | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.s3.embedded.s3Port }}
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "messages.fullname" . }}-s3
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
spec:
  serviceName: {{ include "messages.fullname" . }}-s3
  replicas: 1
  selector:
    matchLabels:
      {{- include "messages.selectorLabels" (dict "root" . "component" "s3") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messages.selectorLabels" (dict "root" . "component" "s3") | nindent 8 }}
      annotations:
        checksum/garage-config: {{ include (print $.Template.BasePath "/garage-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.s3.embedded.podSecurityContext | nindent 8 }}
      containers:
        - name: s3
          image: {{ include "messages.image" .Values.s3.embedded.image | quote }}
          imagePullPolicy: {{ .Values.s3.embedded.image.pullPolicy }}
          command:
            - /garage
            - server
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage.toml
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "messages.secretName" . }}
                  key: {{ .Values.secretKeys.garageRpcSecret }}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "messages.secretName" . }}
                  key: {{ .Values.secretKeys.garageAdminToken }}
          ports:
            - name: s3
              containerPort: {{ .Values.s3.embedded.s3Port }}
            - name: rpc
              containerPort: {{ .Values.s3.embedded.rpcPort }}
            - name: admin
              containerPort: {{ .Values.s3.embedded.adminPort }}
          startupProbe:
            tcpSocket:
              port: s3
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: s3
            {{- toYaml .Values.s3.embedded.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: s3
            {{- toYaml .Values.s3.embedded.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.s3.embedded.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.s3.embedded.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "messages.fullname" . }}-garage
      {{- if not .Values.s3.embedded.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.s3.embedded.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.s3.embedded.persistence.accessModes | nindent 10 }}
        {{- include "messages.storageClass" .Values.s3.embedded.persistence.storageClass | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.s3.embedded.persistence.size }}
  {{- end }}
{{- end }}
