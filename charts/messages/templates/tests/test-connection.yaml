{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "messages.fullname" . }}-test-connection
  labels:
    {{- include "messages.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "messages.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: connection
      image: {{ include "messages.image" .Values.tests.image | quote }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command: [/bin/sh, -ec]
      args:
        - |
          wget -qO- --timeout=10 http://{{ include "messages.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/ >/dev/null
          wget -qO- --timeout=10 --header='Host: {{ .Values.host }}' --header='X-Forwarded-Proto: https' http://{{ include "messages.fullname" . }}-backend:{{ .Values.backend.service.port }}/__heartbeat__/ >/dev/null
      resources: {}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
{{- end }}
