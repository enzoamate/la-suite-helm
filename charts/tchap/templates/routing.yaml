apiVersion: v1
kind: Service
metadata:
  name: {{ include "tchap.fullname" . }}-synapse
  labels: {{- include "tchap.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tchap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: synapse
  ports:
    - name: http
      port: {{ .Values.synapse.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tchap.fullname" . }}-web
  labels: {{- include "tchap.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tchap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- if .Values.ingress.web.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tchap.fullname" . }}-web
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tchap.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
  {{- if .Values.ingress.web.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.web.host }}]
      {{- if .Values.ingress.web.tls.secretName }}
      secretName: {{ .Values.ingress.web.tls.secretName }}
      {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.ingress.matrix.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tchap.fullname" . }}-matrix
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.matrix.host }}
      http:
        paths:
          - path: /_matrix
            pathType: Prefix
            backend:
              service:
                name: {{ include "tchap.fullname" . }}-synapse
                port:
                  number: {{ .Values.synapse.service.port }}
          - path: /_synapse/client
            pathType: Prefix
            backend:
              service:
                name: {{ include "tchap.fullname" . }}-synapse
                port:
                  number: {{ .Values.synapse.service.port }}
  {{- if .Values.ingress.matrix.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.matrix.host }}]
      {{- if .Values.ingress.matrix.tls.secretName }}
      secretName: {{ .Values.ingress.matrix.tls.secretName }}
      {{- end }}
  {{- end }}
{{- end }}
